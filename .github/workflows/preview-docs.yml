name: Preview Documentation

on:
  merge_group:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/preview-docs.yml'
      - '.github/workflows/preview-docs-skipped.yml'

permissions:
  contents: read

env:
  # Among other things, opts out of Turborepo telemetry
  # See https://consoledonottrack.com/
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  VERCEL_TELEMETRY_DISABLED: '1'
  # Some tasks slow down considerably on GitHub Actions runners when concurrency is high
  TURBO_CONCURRENCY: 1
  # Enables Turborepo Remote Caching.
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  preview-docs:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build Documentation Preview
    steps:
      # Every step below is skipped on merge_group events, so the job reports
      # success immediately there. This required check already gated the pull
      # request itself; rebuilding the docs in the merge queue would only slow
      # every queue entry down.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        if: github.event_name == 'pull_request'
        uses: ./.github/workflows/actions/install-dependencies

      - name: Install Isolated Docs Dependencies
        if: github.event_name == 'pull_request'
        working-directory: ./docs/
        shell: bash
        run: pnpm install --ignore-workspace

      - name: Install Vercel CLI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: pnpm install -g vercel

      - name: Deploy to Vercel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        shell: bash
        id: vercel_deploy
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --token="$VERCEL_TOKEN" --yes --environment=preview
          vercel build --token="$VERCEL_TOKEN" --target=preview
          if ! DEPLOY_OUTPUT=$(vercel deploy --token="$VERCEL_TOKEN" --archive=tgz --env GITHUB_PR_NUMBER="$PR_NUMBER" --env GITHUB_PR_BRANCH="$BRANCH_NAME" --prebuilt --target=preview 2>&1); then
            echo "Vercel deploy failed:"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[a-zA-Z0-9.-]*\.vercel\.app' | tail -1)
          echo "preview_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # Dependabot and fork pull requests cannot read the Vercel secrets, so
      # build the docs without deploying a preview. This keeps the check
      # meaningful for those pull requests: a broken docs build fails here
      # instead of being silently skipped.
      - name: Build Documentation (no deploy)
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        working-directory: ./docs/
        shell: bash
        run: pnpm build

      - name: Comment on PR with Preview URL
        if: steps.vercel_deploy.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: '${{ steps.vercel_deploy.outputs.preview_url }}'
        run: |
          gh pr comment $PR_NUMBER --body "Documentation Preview: $PREVIEW_URL" --create-if-none --edit-last
