name: Changelog dry run

# Exercises the changelog generation path on PRs that touch changesets or the Changesets
# tooling, so problems surface here rather than after merge on main. It runs the real
# release-time path — `changeset version` through the resilient adapter in
# `.changeset/changelog.mjs`, hitting the GitHub GraphQL API with the CI token — but the
# resulting version bumps and CHANGELOG edits are discarded with the runner: nothing is
# committed, pushed, or published.
#
# Degraded entries (missing PR/author attribution) are intentionally non-blocking; the
# release job on main degrades gracefully, so a transient GitHub blip on a PR should warn,
# not fail. A crash of `changeset version` itself (e.g. a dependency bump that breaks the
# adapter) does fail the check, since it would break every release and canary publish.

on:
  pull_request:
    paths:
      - '.changeset/**'
      - '.github/workflows/changelog-dry-run.yml'
      # Dependency bumps can break the adapter (e.g. `@changesets/*`).
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  # Lets the job publish a separate "Changelog attribution" check run (neutral/success).
  # Not granted to the token on fork PRs; the job tolerates that.
  checks: write

env:
  DO_NOT_TRACK: '1'

jobs:
  changelog-dry-run:
    name: Changelog dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        uses: ./.github/workflows/actions/install-dependencies

      - name: Generate changelogs (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `changeset version` only loads the changelog adapter when there are pending
          # changesets. If there are none (e.g. a tooling bump), add a throwaway one that
          # references this PR so the adapter and a real GitHub lookup still get exercised.
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md')" ]; then
            printf -- "---\n'@solana/kit': patch\n---\n\npr: #%s\n\nChangelog dry run\n" "$PR_NUMBER" > .changeset/changelog-dry-run.md
          fi

          # Regenerate version bumps + CHANGELOGs locally. The runner is ephemeral and
          # there is no commit/push/publish step, so this only inspects the output.
          set +e
          pnpm exec changeset version 2>&1 | tee changeset-dry-run.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::\`changeset version\` failed (exit code ${exit_code}); releases and canary publishes on main would fail too. See the log above."
            {
              echo "## Changelog dry run"
              echo
              echo "❌ \`changeset version\` failed with exit code ${exit_code}."
              echo
              echo '```'
              tail -n 30 changeset-dry-run.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$exit_code"
          fi

          degraded=$(grep -c '\[changelog\] GitHub lookup failed' changeset-dry-run.log || true)
          if [ "${degraded:-0}" -gt 0 ]; then
            verdict="⚠️ ${degraded} changelog entr(ies) degraded — missing PR/author attribution (see the log above)."
          else
            verdict="✅ All changelog entries resolved with full attribution."
          fi

          # Print the verdict to the step log too, so it's visible without opening the Summary tab.
          echo ""
          echo "$verdict"

          {
            echo "## Changelog dry run"
            echo
            echo "${verdict}"
            if [ "${degraded:-0}" -gt 0 ]; then
              echo
              echo '```'
              grep '\[changelog\] GitHub lookup failed' changeset-dry-run.log || true
              echo '```'
              echo
              echo "This does not block the PR — the release job on \`main\` degrades gracefully too — but the published changelog will lack PR/author links for these entries unless a later run resolves them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Publish the result as a separate check run with a "neutral" conclusion when
          # degraded: visible (distinct from a green pass) but never merge-blocking, even
          # if it were ever made a required check. A clean run reports success. Creating a
          # check needs checks:write, which the token lacks on fork PRs — tolerate that
          # rather than failing the job.
          if [ "${degraded:-0}" -gt 0 ]; then
            conclusion="neutral"
            title="${degraded} changelog entr(ies) degraded"
          else
            conclusion="success"
            title="All changelog entries fully attributed"
          fi
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg title "$title" \
            --arg summary "$verdict" \
            '{name: "Changelog attribution", head_sha: $sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - \
            || echo "::notice::Skipped publishing the neutral check (insufficient token permissions, e.g. a fork PR)."
