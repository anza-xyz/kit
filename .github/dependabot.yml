# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: daily
      time: '01:00'
      timezone: America/Los_Angeles
    ignore:
      - dependency-name: '@radix-ui/react-dropdown-menu'
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'typescript'
      solana-program-clients:
        patterns:
          - '@solana-program/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      undici:
        patterns:
          - 'undici'
          - 'undici-types'
      wallet-standard:
        patterns:
          - '@wallet-standard/*'
          - '@solana/wallet-standard-*'
  - package-ecosystem: 'npm'
    directory: '/docs'
    schedule:
      interval: daily
      time: '01:00'
      timezone: America/Los_Angeles
    ignore:
      # The fumadocs packages must be upgraded to v16 together (fumadocs-ui
      # pins an exact fumadocs-core version) and the upgrade requires code
      # changes to the docs app. Remove this once the docs are migrated to
      # fumadocs v16.
      - dependency-name: 'fumadocs-core'
        update-types: ['version-update:semver-major']
      - dependency-name: 'fumadocs-ui'
        update-types: ['version-update:semver-major']
      - dependency-name: 'fumadocs-mdx'
        update-types: ['version-update:semver-major']
    groups:
      fumadocs:
        patterns:
          - 'fumadocs*'
      eslint:
        patterns:
          - 'eslint*'
          - 'typescript'
      solana:
        patterns:
          - '@solana/*'
      solana-program-clients:
        patterns:
          - '@solana-program/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      undici:
        patterns:
          - 'undici'
          - 'undici-types'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    ignore:
      # changesets/action v2 requires Changesets CLI v3, but this repo uses
      # CLI v2. Remove this once the CLI is upgraded to v3.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
